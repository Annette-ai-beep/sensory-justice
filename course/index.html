<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#1A3B2E;--accent:#C8872A;--bg:#FAF7F2;--cream:#F0E8DC;--text:#2D2D2D;--muted:#6B7B72;--calm:#3B8C5A}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.header{background:var(--primary);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.header a{color:#fff;text-decoration:none}
.header-brand{font-weight:800;letter-spacing:.05em;font-size:1.05rem}
.header-sub{color:rgba(255,255,255,.7);font-size:.8rem}
.back-link{color:rgba(255,255,255,.7);font-size:.82rem;text-decoration:none;transition:color .2s}
.back-link:hover{color:#fff}
.course-frame{flex:1;width:100%;border:none;min-height:calc(100vh - 54px)}
.course-loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.course-loading .spinner{width:48px;height:48px;border:4px solid var(--cream);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.course-loading h2{font-size:1.4rem;font-weight:700;color:var(--primary);margin-bottom:8px}
.course-loading p{font-size:.9rem;color:var(--muted);max-width:400px;line-height:1.5}
.footer{background:var(--primary);padding:16px 20px;text-align:center;flex-shrink:0}
.footer p{color:rgba(255,255,255,.7);font-size:.78rem;line-height:1.5}
.footer a{color:rgba(255,255,255,.85);text-decoration:underline}
</style>
</head>
<body>
  <div class="header">
    <a href="/" style="text-decoration:none;display:flex;align-items:baseline;gap:6px">
      <span class="header-brand">SENSORY JUSTICE</span>
      <span class="header-sub">Through Our Eyes</span>
    </a>
    <a href="/training" class="back-link">← Back to Training</a>
  </div>
  <div id="loading" class="course-loading">
    <div class="spinner"></div>
    <h2>Loading your course…</h2>
    <p>Creating and Communicating Your Sensory Healthcare Plan</p>
  </div>
  <iframe
    id="courseFrame"
    class="course-frame"
    src="https://share.eu.articulate.com/TVDl18J83r3kb2smnbBtw"
    title="Creating and Communicating Your Sensory Healthcare Plan"
    allow="fullscreen; autoplay"
    onload="document.getElementById('loading').style.display='none'"
    style="display:none"
  ></iframe>
  <script>
    // Show iframe after a short delay (gives loading screen a chance)
    setTimeout(function(){ document.getElementById('courseFrame').style.display='block'; }, 300);
  </script>
  <div class="footer">
    <p>(c) 2026 Sensory Justice — <a href="https://sensoryjustice.co.uk">sensoryjustice.co.uk</a> — hello@sensoryjustice.co.uk</p>
    <p style="margin-top:4px;font-size:.72rem">This course is for information purposes only and does not constitute medical advice.</p>
  </div>
</body>
